[project]
name = "salutepy"
version = "0.3.0"
description = "Biometeorological and heat-stress indices on gridded weather data, and the Meteosalute processing chain (CNR-IBE) in Python"
authors = [{ name = "Alfonso Crisci", email = "alfonso.crisci@cnr.it" }]
readme = "README.md"
keywords = ["biometeorology", "thermal comfort", "heat stress", "UTCI", "PET", "WBGT", "GRIB", "NetCDF", "GeoTIFF"]
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "cfgrib>=0.9",
    "rasterio>=1.3",
    "pyreadr>=0.5",
    "pythermalcomfort>=2.8",
    "Pillow>=10.0",
    "natsort>=8.0",
    "eccodes>=1.5",
]

[project.urls]
Homepage = "https://github.com/alfcrisci/salutepy"
Issues = "https://github.com/alfcrisci/salutepy/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
fast = ["numba>=0.58"]

[project.scripts]
salutepy-raster = "salutepy.raster.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["salutepy*"]

[tool.setuptools.package-data]
salutepy = ["gs_scripts/*.gs", "data/*.csv", "data/*.npz", "data/js/*.js"]
